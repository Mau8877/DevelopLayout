# Reverse proxy de PRODUCCIÓN (ver docker-compose.prod.yml).
# Corre con nginx-unprivileged: escucha en 8080/8443 dentro del contenedor
# y el compose los publica como 80/443. TLS es obligatorio (OWASP A04): el
# puerto 80 solo redirige a HTTPS. Los certificados se montan en
# /etc/nginx/certs (fullchain.pem y privkey.pem), ver docs/INFRAESTRUCTURA.md.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rutas temporales escribibles por el usuario sin privilegios.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # DNS embebido de Docker: resuelve backend/frontend en cada request, así
    # nginx arranca aunque un servicio todavía no esté listo (devuelve 502).
    resolver 127.0.0.11 valid=10s;

    server_tokens off;
    # Tamaño máximo del body (API4). La API solo recibe JSON pequeño y hay rutas sin
    # sesión. Una subida de archivos amplía el límite en su propio `location`.
    client_max_body_size 1m;

    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_status 429;

    # La pantalla de restablecer contraseña no manda `Referer`. Se hace con una
    # variable: un `add_header` dentro de un `location` haría que nginx dejara de
    # heredar el resto de las cabeceras de seguridad.
    map $uri $politica_referrer {
        default                     "strict-origin-when-cross-origin";
        ~^/reset-password/?$        "no-referrer";
        ~^/accept-invitation/?$     "no-referrer";
    }

    # TLS: solo protocolos modernos.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server {
        listen 8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy $politica_referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP estricto: el bundle de Vite no usa scripts inline. `style-src
        # 'unsafe-inline'` hace falta por los atributos style de los
        # componentes de UI. Si una pantalla necesita cargar algo de otro
        # origen, se agrega acá de forma explícita.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            set $backend_upstream http://app-backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Sobrescribe (no acumula) X-Forwarded-For: un cliente no puede
            # falsificar su IP para esquivar el rate limit del backend.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # Spring Security manda sus propias cabeceras de seguridad; el
            # proxy ya las agrega a nivel de server, así que se descartan las
            # del upstream para no duplicarlas.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Strict-Transport-Security;
        }

        location / {
            set $frontend_upstream http://app-frontend:8080;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            # El contenedor del frontend ya manda nosniff; el proxy lo agrega
            # a nivel de server. Se descarta el del upstream para no duplicarlo.
            proxy_hide_header X-Content-Type-Options;
        }
    }
}
