worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 127.0.0.11 es el DNS embebido de Docker dentro de la red del compose.
    # Con esto + `set $var ...` + `proxy_pass $var` (en vez de un bloque
    # `upstream {}` con el hostname fijo), nginx resuelve cada backend en
    # tiempo de REQUEST, no al arrancar. Antes, si `app-frontend`
    # o `app-backend` no estaban levantados en el instante exacto
    # en que nginx arrancaba, fallaba con "host not found in upstream" y
    # el proceso moría por completo (sin reintentar solo) -- justo lo que
    # pasó tras un reinicio de Docker Desktop en medio de esta sesión. Con
    # resolución dinámica, nginx arranca igual y devuelve 502 hasta que el
    # contenedor de destino esté disponible, sin necesitar reinicio manual.
    resolver 127.0.0.11 valid=10s;

    # --- Endurecimiento (ver .claude/rules/SEGURIDAD_OWASP.md, A02) ---
    # No revelar la versión de nginx en cabeceras ni páginas de error.
    server_tokens off;
    # Límite de tamaño de body (el backend aplica el suyo por endpoint).
    client_max_body_size 10m;
    # Rate limit en el borde: corta tráfico antes de que llegue a la JVM.
    # Es una capa adicional al RateLimitFilter del backend, no lo reemplaza.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_status 429;

    server {
        # Escuchamos en el puerto 80 estándar
        listen 80;
        server_name localhost;

        # Cabeceras de seguridad (el CSP del frontend en dev necesita
        # 'unsafe-inline'/ws por Vite HMR; en producción se endurece, ver
        # SEGURIDAD_OWASP.md).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # 1. Regla para el Backend: Todo lo que empiece con /api/ va a Spring Boot
        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            set $backend_upstream http://app-backend:8080;
            proxy_pass $backend_upstream;

            # Pasamos las cabeceras originales para que Spring Boot sepa la IP real del cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # SOBRESCRIBE (no acumula) X-Forwarded-For: un cliente no puede
            # falsificar su IP para esquivar el rate limit del backend.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Regla para el Frontend: Cualquier otra ruta va a React (Vite)
        location / {
            set $frontend_upstream http://app-frontend:5173;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;

            # 3. Soporte OBLIGATORIO para WebSockets (Vite HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
