# infrastructure/redis/redis.conf
maxmemory 256mb
# ! No cambiar a una política de desalojo (allkeys-* ni volatile-*): Redis guarda
# ! los bloqueos de login y las sesiones revocadas. Al llenarse, las escrituras
# ! fallan (falla cerrado) en vez de borrar esos datos. Si se agrega caché, va en
# ! otra instancia o con claves con TTL y memoria dimensionada.
maxmemory-policy noeviction
appendonly yes


# El password NO va acá (este archivo se commitea): docker-compose.yml lo pasa
# con --requirepass desde REDIS_PASSWORD.
