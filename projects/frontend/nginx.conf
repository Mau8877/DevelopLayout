# Config del nginx que SIRVE los estáticos del frontend en producción
# (ver projects/frontend/Dockerfile). No hace de proxy de la API.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    # Assets con hash en el nombre (Vite): cacheables por un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA con TanStack Router: cualquier ruta que no sea un archivo real
    # devuelve index.html y el router resuelve en el cliente. index.html
    # nunca se cachea para que un deploy nuevo se vea de inmediato.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
