# Perfil `test`: se activa solo en `mvn test` (ver surefire en pom.xml).
# Credenciales por defecto SOLO para tests locales contra un Postgres de
# desarrollo; en CI y en Compose llegan por variables de entorno
# (SPRING_DATASOURCE_*), que tienen prioridad sobre estos defaults.
# application.properties (base/producción) NO tiene credenciales por defecto.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# En test no hay Redis: sin esto /health devuelve 503 (Redis DOWN) y los tests
# de CORS/seguridad, que usan /health, fallarían por algo ajeno a lo que prueban.
management.health.redis.enabled=false

# Rol de runtime y administrador inicial para los tests de contexto completo.
spring.flyway.placeholders.APP_RUNTIME_PASSWORD=test_runtime_pass
app.initial-admin.email=admin@test.local
app.initial-admin.password=TestAdmin12345

app.jwt.secret=test-secret-test-secret-test-secret-1234

app.ratelimit.login-capacity=1000
app.ratelimit.login-refill-per-minute=1000
