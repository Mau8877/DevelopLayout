spring.application.name=app-backend

# ==========================================
# SEGURO POR DEFECTO
# ==========================================
# Este archivo es la configuración base (producción/CI): sin credenciales por
# defecto, sin SQL en consola, sin Swagger y sin detalle de health. Todo lo
# que sea comodidad de desarrollo vive en application-dev.properties (perfil
# `dev`). Ver .claude/rules/SEGURIDAD_OWASP.md (A02 Security Misconfiguration).

# ==========================================
# 1. BASE DE DATOS (PostgreSQL)
# ==========================================
# Sintaxis: ${VARIABLE_DE_ENTORNO:valor_por_defecto_si_no_existe}
# Usuario y password NO tienen default a propósito: si falta la variable, la
# app falla al arrancar en vez de conectarse con credenciales conocidas.
# * SPRING_DATASOURCE_USERNAME es el rol de RUNTIME (sin DDL, sin BYPASSRLS).
# * Flyway usa otro rol (dueño del esquema) -- ver sección 3 y
# * .claude/rules/backend/BASE_DE_DATOS_PRIVADA_RLS.md.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
# CRÍTICO: 'validate' verifica que la BD coincida con tus Entities, pero NO modifica la BD.
spring.jpa.hibernate.ddl-auto=validate
# * El SQL en consola solo se activa en el perfil dev: los logs de SQL pueden
# * filtrar datos de usuarios (ver LOGGING_BACKEND.md y OWASP A09).
spring.jpa.show-sql=false
# La conexión se devuelve al terminar cada transacción, no al terminar el request:
# retenerla durante todo el request ayuda a agotar el pool.
spring.jpa.open-in-view=false

# ==========================================
# 3. FLYWAY (Migraciones Controladas)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Evita errores si la base de datos ya tenía tablas previas creadas manualmente
spring.flyway.baseline-on-migrate=true
# Contraseña del rol app_runtime (migración V20261125063100). Sin default: llega por entorno.
spring.flyway.placeholders.APP_RUNTIME_PASSWORD=${APP_RUNTIME_PASSWORD}
# * Flyway corre con el rol DUEÑO del esquema (puede hacer DDL), distinto del
# * rol de runtime de la app. Si SPRING_FLYWAY_USER no está definida, usa las
# * mismas credenciales del datasource (caso CI / un solo rol).
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

# ==========================================
# 4. CACHÉ (Redis)
# ==========================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379
# Password vacío = sin autenticación (solo CI / Redis local sin password).
# El stack de docker-compose SIEMPRE arranca Redis con password.
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# ==========================================
# 5. ALMACENAMIENTO (MinIO - Propiedades Custom)
# ==========================================
# Spring no soporta MinIO nativamente, creamos nuestro propio namespace 'app.minio'
# Sin credenciales por defecto (vacío): el código que use MinIO debe validar
# que no estén vacías antes de conectar.
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ROOT_USER:}
app.minio.secret-key=${MINIO_ROOT_PASSWORD:}
app.minio.bucket-name=app-storage

# ==========================================
# 6. ACTUATOR (Health check + métricas Prometheus)
# ==========================================
# base-path=/ sirve los endpoints habilitados en la raíz (ej. /health en vez de /actuator/health)
management.endpoints.web.base-path=/
# `never`: /health es público, no debe revelar el estado interno de Postgres/Redis.
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# 7. CORS (Frontend <-> Backend)
# ==========================================
# Lista separada por comas de orígenes permitidos. Sobreescribible por variable de entorno.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ==========================================
# 8. RATE LIMIT (anti-abuso, por IP)
# ==========================================
# Aplica solo a /api/v1/** (ver RateLimitFilter) -- no a /health, /prometheus
# ni /swagger-ui/**, que reciben tráfico interno constante (ej. Prometheus
# scrapeando cada 5s, ver infrastructure/prometheus/prometheus.yml).
app.ratelimit.capacity=${RATE_LIMIT_CAPACITY:100}
app.ratelimit.refill-per-minute=${RATE_LIMIT_REFILL_PER_MINUTE:100}

# ==========================================
# 9. SERVIDOR / IP REAL DEL CLIENTE / ERRORES
# ==========================================
# * Detrás de nginx, request.getRemoteAddr() sería siempre la IP del proxy y
# * el rate limit compartiría UN solo bucket entre todos los clientes. Con
# * `native`, Tomcat reemplaza la IP remota por la de X-Forwarded-For SOLO si
# * quien se conecta es un proxy interno de confianza (rangos privados, como
# * la red de Docker). nginx SOBRESCRIBE ese header (no lo acumula), ver
# * infrastructure/nginx/nginx.conf.
server.forward-headers-strategy=native
# Nunca devolver mensajes de excepción, stacktraces ni detalles de binding al cliente.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ==========================================
# 10. DOCUMENTACIÓN DE LA API (springdoc / Swagger)
# ==========================================
# Apagada por defecto. Se enciende con SWAGGER_ENABLED=true (el perfil dev
# ya la enciende). En producción la superficie de ataque sin necesidad no se publica.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ===================================================
# ADMINISTRADOR INICIAL (HU-INICIAL-Base, UT BE-04)
# ===================================================
# Sin defaults: si no existe ningún SUPER_ADMIN y falta alguno, la app no arranca.
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# JWT: sin default a propósito; la app falla al arrancar si falta o es corta (< 32 caracteres).
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=PT15M
app.jwt.issuer=app-backend

# Clave que firma los refresh tokens: sin default, mínimo 32 caracteres y distinta de JWT_SECRET.
app.auth.refresh-token-secret=${REFRESH_TOKEN_SECRET}

# Autenticación
app.auth.max-failed-attempts=5
app.auth.lock-duration=PT15M
# Intentos por correo e IP: app.auth.max-failed-attempts. Tope por cuenta sumando todas las IP:
app.auth.max-failed-attempts-per-account=${LOGIN_MAX_ATTEMPTS_PER_ACCOUNT:100}
app.auth.refresh-ttl=P7D
app.auth.session-max-lifetime=P30D

# Cookies de sesión: Secure por defecto; el perfil dev lo pisa a false (HTTP local).
app.cookies.secure=true

# Un body con propiedades desconocidas se rechaza (400) en vez de ignorarse: sin mass assignment.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Rate limit más estricto para el login (por IP), además del global.
app.ratelimit.login-capacity=10
app.ratelimit.login-refill-per-minute=10

# Límite propio por IP para /refresh, además del global.
app.ratelimit.refresh-capacity=30
app.ratelimit.refresh-refill-per-minute=30

# Máximo de clientes (IP) que retiene cada contador en memoria.
app.ratelimit.max-clients=100000

# Bitácora: meses que se conservan los eventos (purga diaria a las 03:00 del servidor).
app.bitacora.retention-months=${BITACORA_RETENTION_MONTHS:12}
