# ==========================================
# PERFIL dev -- solo comodidades de desarrollo local
# ==========================================
# Se activa con SPRING_PROFILES_ACTIVE=dev (docker-compose.yml lo hace) o con
# -Dspring-boot.run.profiles=dev. NUNCA se activa en producción.

# Credenciales por defecto SOLO para correr el backend suelto contra un
# Postgres/MinIO local sin Docker Compose. Compose siempre las pasa por .env.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
app.minio.access-key=${MINIO_ROOT_USER:minio_admin}
app.minio.secret-key=${MINIO_ROOT_PASSWORD:minio_local_pass_123}

# SQL formateado en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Detalle de health (útil para depurar la conexión a Postgres/Redis)
management.endpoint.health.show-details=always

# Swagger UI encendido
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.cookies.secure=false

# Correo: Mailpit local (con Compose, las variables apuntan a app-mailpit).
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
