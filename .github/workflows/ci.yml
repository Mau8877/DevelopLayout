name: CI

# Corre en cada PR contra main y en cada push directo a main (ej. un merge).
# No hay job de deploy acá -- ver .claude/rules/CI_CD.md para por qué CD
# todavía no está definido para este proyecto.

# Permisos mínimos por defecto (OWASP A08): ningún job escribe en el repo.
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Detecta qué carpetas cambiaron para no correr, por ejemplo, todo el
  # pipeline de Flutter cuando el cambio solo tocó el backend -- ver
  # .claude/rules/CI_CD.md#un-job-por-proyecto-no-uno-solo-para-todo.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      scripts: ${{ steps.filter.outputs.scripts }}
      produccion: ${{ steps.filter.outputs.produccion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - '.github/workflows/ci.yml'
              - 'projects/backend/**'
              - 'infrastructure/redis/**'
            frontend:
              - '.github/workflows/ci.yml'
              - 'projects/frontend/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            mobile:
              - '.github/workflows/ci.yml'
              - 'projects/mobile/**'
            scripts:
              - '.github/workflows/ci.yml'
              - 'scripts/**'
              - 'docker-compose*.yml'
              - 'infrastructure/nginx/Dockerfile'
              - 'projects/frontend/Dockerfile'
              - 'package.json'
            produccion:
              - 'infrastructure/**'
              - 'docker-compose.prod.yml'
              - '.env.example'
              - '.github/workflows/ci.yml'
              - 'scripts/prod-smoke.mjs'
              - 'scripts/db-backup.mjs'
              - 'scripts/setup-env.mjs'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend
    # * Servicios reales para los tests que arrancan el contexto completo de Spring
    # * (AppBackendApplicationTests: Flyway necesita Postgres; el health check de /health
    # * necesita Redis). Mismas versiones que docker-compose.yml. Credenciales descartables
    # * de CI, no secretos: la base vive solo mientras dura el job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # El runner de Ubuntu trae Docker nativo (a diferencia del socket
      # restringido de Docker Desktop en Windows, ver TESTING_BACKEND.md),
      # así que los tests con Testcontainers corren de verdad acá en vez
      # de quedar SKIPPED como en el setup local de Windows.
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x ./mvnw
      # mvnw baja Maven de Maven Central (`cache: maven` de setup-java lo guarda
      # entre corridas). Si la descarga falla, se usa el Maven que trae el runner.
      - name: Preparar Maven
        env:
          # Sin esto mvnw llama a wget en silencio y no se ve por qué falló.
          MVNW_VERBOSE: 'true'
        run: |
          for intento in 1 2 3; do
            if ./mvnw -B --version; then
              echo "MVN=./mvnw" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Intento $intento fallido"
            if [ "$intento" -lt 3 ]; then sleep $((intento * 15)); fi
          done
          echo "::warning::mvnw no pudo descargar Maven (ver el log de este paso). Se usa el Maven del runner."
          mvn -B --version
          echo "MVN=mvn" >> "$GITHUB_ENV"
      - name: Checkstyle
        run: $MVN -B checkstyle:check
      - name: Tests
        run: $MVN -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/app_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: localhost
      - name: Build
        run: $MVN -B clean package -DskipTests

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Misma major que el desarrollo local: el `overrides` de
          # pnpm-workspace.yaml (fix de minimatch) lo lee pnpm >= 10.
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # El lockfile vive en la raíz del workspace pnpm, no dentro de
      # projects/frontend -- ver docs/README.md.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir projects/frontend run lint
      - run: pnpm --dir projects/frontend run test
      - run: pnpm --dir projects/frontend run build
      # Falla con cualquier vulnerabilidad conocida (moderada o peor).
      - run: pnpm audit --audit-level moderate

  # Tests de los scripts de la raíz (setup-env, respaldos). Solo Node: no instala nada.
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test "scripts/**/*.test.mjs"

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Versión fija, la misma del desarrollo local: con "stable" a secas, una
          # versión nueva de Flutter puede romper el CI sin que cambie el código.
          # Se sube a propósito (Dependabot no la actualiza).
          flutter-version: '3.44.8'
      - run: flutter pub get
      # pubspec.yaml declara `.env` como asset (ver CONSUMO_API_MOBILE.md) --
      # el archivo real no se commitea (.gitignore), así que sin este paso
      # `flutter analyze` falla con "asset_does_not_exist" en un checkout
      # limpio como el de CI. Mismo criterio que backend/frontend: se arma
      # a partir de `.env.example`, con valores dummy que alcanzan para que
      # el análisis/los tests corran (no pegan contra un backend real).
      - run: cp .env.example .env
      - run: flutter analyze
      - run: flutter test

  # ---------------------------------------------------------------
  # Seguridad transversal (ver .claude/rules/SEGURIDAD_OWASP.md).
  # Corre siempre, no solo cuando cambia una carpeta: un secreto o una
  # dependencia vulnerable pueden venir en cualquier cambio.
  # ---------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: gitleaks revisa los commits del PR, no solo
          # el árbol final.
          fetch-depth: 0
      - name: Detección de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El workflow solo tiene permiso de lectura: sin esto intenta comentar el
          # PR y falla con "Resource not accessible by integration". El detalle queda
          # en el resumen del job.
          GITLEAKS_ENABLE_COMMENTS: 'false'
      # Trivy en modo filesystem: lee pom.xml, pnpm-lock.yaml y pubspec.lock
      # (dependencias vulnerables, también transitivas), y revisa los
      # Dockerfile y el compose de producción (misconfiguraciones).
      - name: Dependencias vulnerables (Trivy)
        # v0.36.0: las etiquetas anteriores a 0.35.0 fueron borradas tras el
        # compromiso de marzo de 2026 (GHSA-69fq-xp46-6x23); 0.35.0 y v0.36.0
        # son releases inmutables.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Construye y escanea las imágenes de producción, y levanta el stack completo con
  # datos descartables. No publica nada (CD sigue sin implementarse).
  docker:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.produccion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build imagen backend
        run: docker build -t app-backend:ci projects/backend
      - name: Build imagen frontend
        run: docker build -f projects/frontend/Dockerfile -t app-frontend:ci .
      - name: Build imagen proxy
        run: docker build -t app-proxy:ci infrastructure/nginx
      # Trivy sobre las imágenes ya construidas: revisa también los paquetes del
      # sistema base y el runtime (JRE, nginx), que el escaneo del repo no ve.
      # ignore-unfixed: solo falla por lo que ya tiene arreglo disponible.
      - name: Vulnerabilidades en la imagen backend (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Vulnerabilidades en la imagen frontend (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Vulnerabilidades en la imagen proxy (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-proxy:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Validar docker-compose.prod.yml
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --quiet
        env:
          TLS_CERT_DIR: /tmp
          CORS_ALLOWED_ORIGINS: https://ci.example.com
          MINIO_IMAGE: cgr.dev/chainguard/minio:latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Arranque, entrada por HTTPS, sesiones, bucket privado, y respaldo restaurado en
      # un servidor vacío. Genera sus secretos y su certificado; usa volúmenes propios.
      - name: Producción de punta a punta y recuperación
        run: node scripts/prod-smoke.mjs
        env:
          # Mismo tag que los builds de arriba: reutiliza sus capas.
          APP_VERSION: ci
