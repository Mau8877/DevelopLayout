name: CI

# Corre en cada PR contra main y en cada push directo a main (ej. un merge).
# No hay job de deploy acá -- ver .claude/rules/CI_CD.md para por qué CD
# todavía no está definido para este proyecto.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Detecta qué carpetas cambiaron para no correr, por ejemplo, todo el
  # pipeline de Flutter cuando el cambio solo tocó el backend -- ver
  # .claude/rules/CI_CD.md#un-job-por-proyecto-no-uno-solo-para-todo.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'projects/backend/**'
            frontend:
              - 'projects/frontend/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            mobile:
              - 'projects/mobile/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # El runner de Ubuntu trae Docker nativo (a diferencia del socket
      # restringido de Docker Desktop en Windows, ver TESTING_BACKEND.md),
      # así que los tests con Testcontainers corren de verdad acá en vez
      # de quedar SKIPPED como en el setup local de Windows.
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x ./mvnw
      - name: Checkstyle
        run: ./mvnw -B checkstyle:check
      - name: Tests
        run: ./mvnw -B test
      - name: Build
        run: ./mvnw -B clean package -DskipTests

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # El lockfile vive en la raíz del workspace pnpm, no dentro de
      # projects/frontend -- ver docs/README.md.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir projects/frontend run lint
      - run: pnpm --dir projects/frontend run test
      - run: pnpm --dir projects/frontend run build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
